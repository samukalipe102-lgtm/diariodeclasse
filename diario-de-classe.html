<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diário de Classe</title>
<style>
  :root{
    --azul:#1f6feb; --azul-escuro:#174ea6; --cinza:#f3f5f8; --cinza-borda:#d9dee6;
    --verde:#1a7f37; --vermelho:#cf222e; --texto:#1c2430; --suave:#6b7685;
  }
  *{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
  body{margin:0;background:var(--cinza);color:var(--texto);}
  header{background:var(--azul);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  header h1{font-size:20px;margin:0;}
  header .sub{font-size:12px;opacity:.9;}
  nav{background:#fff;border-bottom:1px solid var(--cinza-borda);display:flex;flex-wrap:wrap;}
  nav button{border:0;background:none;padding:14px 18px;font-size:15px;cursor:pointer;color:var(--suave);border-bottom:3px solid transparent;}
  nav button.ativo{color:var(--azul);border-bottom-color:var(--azul);font-weight:600;}
  nav button:hover{background:var(--cinza);}
  main{padding:20px;max-width:1100px;margin:0 auto;}
  .card{background:#fff;border:1px solid var(--cinza-borda);border-radius:10px;padding:18px;margin-bottom:18px;}
  .card h2{margin:0 0 14px;font-size:17px;}
  label{display:block;font-size:13px;color:var(--suave);margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--cinza-borda);border-radius:7px;font-size:14px;}
  textarea{resize:vertical;min-height:90px;}
  button.btn{background:var(--azul);color:#fff;border:0;padding:9px 16px;border-radius:7px;font-size:14px;cursor:pointer;}
  button.btn:hover{background:var(--azul-escuro);}
  button.btn.secund{background:#fff;color:var(--azul);border:1px solid var(--azul);}
  button.btn.perigo{background:var(--vermelho);}
  button.btn.verde{background:var(--verde);}
  button.mini{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--cinza-borda);background:#fff;cursor:pointer;}
  button.mini.perigo{color:var(--vermelho);border-color:#f3c0c4;}
  button.mini.perigo:hover{background:#fff0f1;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--cinza-borda);}
  th{background:var(--cinza);font-weight:600;font-size:13px;color:var(--suave);}
  tr:hover td{background:#fafbfc;}
  .linha{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .linha > div{flex:1;min-width:160px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill.p{background:#dafbe1;color:var(--verde);}
  .pill.f{background:#ffebe9;color:var(--vermelho);}
  .vazio{color:var(--suave);text-align:center;padding:30px;font-style:italic;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar .cresce{flex:1;min-width:150px;}
  .aviso{background:#fff8c5;border:1px solid #eac54f;padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;}
  .ok{background:#dafbe1;border:1px solid #4ac26b;padding:10px 12px;border-radius:7px;font-size:13px;margin-bottom:14px;}
  .chk{width:auto;}
  .media-alta{color:var(--verde);font-weight:700;}
  .media-baixa{color:var(--vermelho);font-weight:700;}
  @media print{nav,header .sub,.noprint{display:none!important;}body{background:#fff;}.card{border:0;}}
</style>
</head>
<body>
<header>
  <div>
    <h1>📘 Diário de Classe</h1>
    <div class="sub">Seus dados ficam salvos só neste computador, neste navegador.</div>
  </div>
</header>

<nav id="nav"></nav>
<main id="conteudo"></main>

<script>
/* =========================================================
   DIÁRIO DE CLASSE - app de arquivo único
   Dados salvos no localStorage do navegador (fica no seu PC)
   ========================================================= */

const STORE_KEY = "diario_classe_v1";

/* ---------- Estado ---------- */
let dados = carregar();

function estadoInicial(){
  return {
    turmas: [],      // {id, nome, ano}
    alunos: [],      // {id, nome, turmaId}
    materias: [],    // {id, nome, turmaId}
    conteudos: [],   // {id, turmaId, materiaId, data, texto}
    presencas: {},   // chave "turmaId|data" -> { alunoId: true(presente)/false(falta) }
    notas: []        // {id, alunoId, materiaId, descricao, valor}
  };
}
function carregar(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return estadoInicial();
    return Object.assign(estadoInicial(), JSON.parse(raw));
  }catch(e){ return estadoInicial(); }
}
function salvar(){ localStorage.setItem(STORE_KEY, JSON.stringify(dados)); }
function id(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- Navegação ---------- */
const ABAS = [
  {id:"turmas",   nome:"🏫 Turmas"},
  {id:"alunos",   nome:"👩‍🎓 Alunos"},
  {id:"matricula",nome:"📝 Matrícula"},
  {id:"presenca", nome:"✅ Presença"},
  {id:"notas",    nome:"🔢 Notas"},
  {id:"conteudo", nome:"📚 Conteúdo"},
  {id:"dados",    nome:"💾 Backup"},
];
let abaAtual = "turmas";

function montarNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  ABAS.forEach(a=>{
    const b = document.createElement("button");
    b.textContent = a.nome;
    if(a.id===abaAtual) b.className="ativo";
    b.onclick = ()=>{ abaAtual=a.id; render(); };
    nav.appendChild(b);
  });
}

/* ---------- Helpers ---------- */
function turmaNome(tid){ const t=dados.turmas.find(x=>x.id===tid); return t?t.nome:"—"; }
function alunosDaTurma(tid){ return dados.alunos.filter(a=>a.turmaId===tid).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function materiasDaTurma(tid){ return dados.materias.filter(m=>m.turmaId===tid).sort((a,b)=>a.nome.localeCompare(b.nome)); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hojeISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function dataBR(iso){ if(!iso) return ""; const [a,m,d]=iso.split("-"); return `${d}/${m}/${a}`; }

/* =========================================================
   RENDER principal
   ========================================================= */
function render(){
  montarNav();
  const c = document.getElementById("conteudo");
  c.innerHTML = "";
  ({turmas:tela_turmas, alunos:tela_alunos, matricula:tela_matricula,
    presenca:tela_presenca, notas:tela_notas, conteudo:tela_conteudo, dados:tela_dados}[abaAtual])(c);
}

/* ---------- TELA: Turmas ---------- */
function tela_turmas(c){
  c.innerHTML = `
  <div class="card">
    <h2>Nova turma</h2>
    <div class="linha">
      <div><label>Nome da turma</label><input id="t_nome" placeholder="Ex: 6º Ano A"></div>
      <div style="max-width:140px"><label>Ano/Série</label><input id="t_ano" placeholder="2026"></div>
      <div style="flex:0"><button class="btn" onclick="addTurma()">Adicionar</button></div>
    </div>
  </div>
  <div class="card">
    <h2>Turmas cadastradas (${dados.turmas.length})</h2>
    <div id="lista_turmas"></div>
  </div>`;
  const alvo = document.getElementById("lista_turmas");
  if(!dados.turmas.length){ alvo.innerHTML = `<div class="vazio">Nenhuma turma ainda. Crie a primeira acima.</div>`; return; }
  let h = `<table><tr><th>Turma</th><th>Ano</th><th>Alunos</th><th class="noprint"></th></tr>`;
  dados.turmas.forEach(t=>{
    h += `<tr>
      <td>${esc(t.nome)}</td><td>${esc(t.ano||"")}</td>
      <td>${alunosDaTurma(t.id).length}</td>
      <td class="noprint" style="text-align:right">
        <button class="mini perigo" onclick="delTurma('${t.id}')">🗑 Apagar</button>
      </td></tr>`;
  });
  alvo.innerHTML = h+"</table>";
}
function addTurma(){
  const nome=document.getElementById("t_nome").value.trim();
  const ano=document.getElementById("t_ano").value.trim();
  if(!nome){ alert("Digite o nome da turma."); return; }
  dados.turmas.push({id:id(),nome,ano}); salvar(); render();
}
function delTurma(tid){
  const nome=turmaNome(tid);
  const qtd=alunosDaTurma(tid).length;
  if(qtd===0){
    if(!confirm(`Apagar a turma "${nome}"?`)) return;
    finalizaDelTurma(tid,false); return;
  }
  // Turma tem alunos: perguntar o que fazer
  const apagarAlunos = confirm(
    `A turma "${nome}" tem ${qtd} aluno(s).\n\n`+
    `• Clique OK para APAGAR a turma E todos os ${qtd} aluno(s) dela (com as notas).\n`+
    `• Clique CANCELAR para só apagar a turma e deixar os alunos SEM turma (sem apagar os alunos).`
  );
  if(apagarAlunos){
    if(!confirm(`Tem certeza? Isso vai apagar a turma "${nome}" e os ${qtd} aluno(s) dela permanentemente. Não dá pra desfazer.`)) return;
  }
  finalizaDelTurma(tid, apagarAlunos);
}
function finalizaDelTurma(tid, apagarAlunos){
  if(apagarAlunos){
    const idsAlunos=dados.alunos.filter(a=>a.turmaId===tid).map(a=>a.id);
    dados.alunos=dados.alunos.filter(a=>a.turmaId!==tid);
    dados.notas=dados.notas.filter(n=>!idsAlunos.includes(n.alunoId));
  } else {
    dados.alunos.forEach(a=>{ if(a.turmaId===tid) a.turmaId=null; });
  }
  dados.turmas=dados.turmas.filter(t=>t.id!==tid);
  dados.materias=dados.materias.filter(m=>m.turmaId!==tid);
  dados.conteudos=dados.conteudos.filter(x=>x.turmaId!==tid);
  // limpa presenças da turma
  Object.keys(dados.presencas).forEach(k=>{ if(k.startsWith(tid+"|")) delete dados.presencas[k]; });
  salvar(); render();
}

/* ---------- TELA: Alunos (cadastro + apagar + importar em lote) ---------- */
function tela_alunos(c){
  const opcoes = dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("");
  c.innerHTML = `
  <div class="card">
    <h2>Adicionar aluno</h2>
    <div class="linha">
      <div><label>Nome do aluno</label><input id="a_nome" placeholder="Nome completo"></div>
      <div style="max-width:220px"><label>Turma</label><select id="a_turma">${opcoes||`<option value="">(crie uma turma primeiro)</option>`}</select></div>
      <div style="flex:0"><button class="btn" onclick="addAluno()">Adicionar</button></div>
    </div>
  </div>

  <div class="card">
    <h2>📋 Importar vários alunos de uma vez</h2>
    <div class="aviso">Cole a lista de nomes (um por linha). Útil pra trazer sua turma inteira sem digitar um por um.</div>
    <div class="linha">
      <div style="max-width:220px"><label>Turma de destino</label><select id="imp_turma">${opcoes||`<option value="">(crie uma turma primeiro)</option>`}</select></div>
    </div>
    <label>Lista de nomes (um por linha)</label>
    <textarea id="imp_lista" placeholder="Maria Silva&#10;João Souza&#10;Ana Oliveira"></textarea>
    <div style="margin-top:10px"><button class="btn verde" onclick="importarAlunos()">Importar lista</button></div>
  </div>

  <div class="card">
    <h2>Alunos cadastrados (${dados.alunos.length})</h2>
    <div class="toolbar noprint">
      <div class="cresce"><input id="busca" placeholder="🔎 Buscar por nome..." oninput="render_lista_alunos()"></div>
      <select id="filtro_turma" onchange="render_lista_alunos()">
        <option value="">Todas as turmas</option>
        ${dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("")}
      </select>
    </div>
    <div id="lista_alunos"></div>
  </div>`;
  render_lista_alunos();
}
function render_lista_alunos(){
  const alvo=document.getElementById("lista_alunos"); if(!alvo) return;
  const busca=(document.getElementById("busca")?.value||"").toLowerCase();
  const ft=document.getElementById("filtro_turma")?.value||"";
  let lista=dados.alunos.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  if(busca) lista=lista.filter(a=>a.nome.toLowerCase().includes(busca));
  if(ft) lista=lista.filter(a=>a.turmaId===ft);
  if(!lista.length){ alvo.innerHTML=`<div class="vazio">Nenhum aluno encontrado.</div>`; return; }
  let h=`<div class="toolbar noprint" style="background:var(--cinza);padding:8px 10px;border-radius:7px">
      <label style="margin:0;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" class="chk" onclick="marcarTodosAlunos(this)"> Selecionar todos (${lista.length})
      </label>
      <span class="cresce"></span>
      <span id="contador_sel" style="font-size:13px;color:var(--suave)"></span>
      <button class="btn perigo" onclick="apagarAlunosEmMassa()">🗑 Apagar selecionados</button>
    </div>`;
  h+=`<table><tr><th class="noprint" style="width:34px"></th><th>Nome</th><th>Turma</th><th class="noprint"></th></tr>`;
  lista.forEach(a=>{
    h+=`<tr>
      <td class="noprint"><input type="checkbox" class="chk aluno-chk" value="${a.id}" onchange="atualizarContadorSel()"></td>
      <td>${esc(a.nome)}</td>
      <td>${a.turmaId?esc(turmaNome(a.turmaId)):'<span class="pill f">sem turma</span>'}</td>
      <td class="noprint" style="text-align:right">
        <button class="mini perigo" onclick="delAluno('${a.id}')">🗑 Apagar</button>
      </td></tr>`;
  });
  alvo.innerHTML=h+"</table>";
  atualizarContadorSel();
}
function marcarTodosAlunos(cb){ document.querySelectorAll(".aluno-chk").forEach(c=>c.checked=cb.checked); atualizarContadorSel(); }
function atualizarContadorSel(){
  const n=document.querySelectorAll(".aluno-chk:checked").length;
  const el=document.getElementById("contador_sel");
  if(el) el.textContent = n? `${n} selecionado(s)` : "";
}
function apagarAlunosEmMassa(){
  const ids=[...document.querySelectorAll(".aluno-chk:checked")].map(c=>c.value);
  if(!ids.length){ alert("Marque pelo menos um aluno para apagar."); return; }
  if(!confirm(`Apagar ${ids.length} aluno(s) selecionado(s)?\n\nAs notas deles também serão apagadas. Esta ação não pode ser desfeita.`)) return;
  dados.alunos=dados.alunos.filter(a=>!ids.includes(a.id));
  dados.notas=dados.notas.filter(n=>!ids.includes(n.alunoId));
  salvar();
  alert(`${ids.length} aluno(s) apagado(s).`);
  render();
}
function addAluno(){
  const nome=document.getElementById("a_nome").value.trim();
  const turmaId=document.getElementById("a_turma").value||null;
  if(!nome){ alert("Digite o nome do aluno."); return; }
  dados.alunos.push({id:id(),nome,turmaId}); salvar(); render();
}
function importarAlunos(){
  const turmaId=document.getElementById("imp_turma").value||null;
  const bruto=document.getElementById("imp_lista").value;
  const nomes=bruto.split("\n").map(s=>s.trim()).filter(Boolean);
  if(!nomes.length){ alert("Cole pelo menos um nome."); return; }
  nomes.forEach(nome=>dados.alunos.push({id:id(),nome,turmaId}));
  salvar();
  alert(`${nomes.length} aluno(s) importado(s)${turmaId?' para a turma '+turmaNome(turmaId):''}.`);
  render();
}
function delAluno(aid){
  const a=dados.alunos.find(x=>x.id===aid);
  if(!confirm(`Apagar o aluno "${a?.nome}"?\n\nAs notas dele também serão apagadas.`)) return;
  dados.alunos=dados.alunos.filter(x=>x.id!==aid);
  dados.notas=dados.notas.filter(n=>n.alunoId!==aid);
  salvar(); render();
}

/* ---------- TELA: Matrícula (mover alunos entre turmas rápido) ---------- */
function tela_matricula(c){
  if(!dados.turmas.length){ c.innerHTML=`<div class="card"><div class="vazio">Crie uma turma primeiro na aba Turmas.</div></div>`; return; }
  const opcoes=dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("");
  c.innerHTML=`
  <div class="card">
    <h2>Matricular / mover alunos</h2>
    <div class="aviso">Marque os alunos e escolha pra qual turma mandar. Serve pra matricular, trocar de turma ou tirar da turma.</div>
    <div class="toolbar">
      <div class="cresce"><input id="m_busca" placeholder="🔎 Buscar aluno..." oninput="render_matricula()"></div>
      <label style="margin:0">Mostrar:</label>
      <select id="m_filtro" onchange="render_matricula()">
        <option value="">Todos</option>
        <option value="sem">Só sem turma</option>
        ${dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("")}
      </select>
    </div>
    <div id="lista_matricula"></div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--cinza-borda)">
    <div class="linha">
      <div style="max-width:260px"><label>Mandar selecionados para</label>
        <select id="m_destino"><option value="">— Sem turma —</option>${opcoes}</select></div>
      <div style="flex:0"><button class="btn verde" onclick="aplicarMatricula()">Aplicar aos selecionados</button></div>
    </div>
  </div>`;
  render_matricula();
}
function render_matricula(){
  const alvo=document.getElementById("lista_matricula"); if(!alvo) return;
  const busca=(document.getElementById("m_busca")?.value||"").toLowerCase();
  const f=document.getElementById("m_filtro")?.value||"";
  let lista=dados.alunos.slice().sort((a,b)=>a.nome.localeCompare(b.nome));
  if(busca) lista=lista.filter(a=>a.nome.toLowerCase().includes(busca));
  if(f==="sem") lista=lista.filter(a=>!a.turmaId);
  else if(f) lista=lista.filter(a=>a.turmaId===f);
  if(!lista.length){ alvo.innerHTML=`<div class="vazio">Nenhum aluno.</div>`; return; }
  let h=`<table><tr><th class="noprint"><input type="checkbox" class="chk" onclick="marcarTodos(this)"></th><th>Nome</th><th>Turma atual</th></tr>`;
  lista.forEach(a=>{
    h+=`<tr>
      <td class="noprint"><input type="checkbox" class="chk mat-chk" value="${a.id}"></td>
      <td>${esc(a.nome)}</td>
      <td>${a.turmaId?esc(turmaNome(a.turmaId)):'<span class="pill f">sem turma</span>'}</td>
    </tr>`;
  });
  alvo.innerHTML=h+"</table>";
}
function marcarTodos(cb){ document.querySelectorAll(".mat-chk").forEach(c=>c.checked=cb.checked); }
function aplicarMatricula(){
  const ids=[...document.querySelectorAll(".mat-chk:checked")].map(c=>c.value);
  if(!ids.length){ alert("Marque pelo menos um aluno."); return; }
  const destino=document.getElementById("m_destino").value||null;
  dados.alunos.forEach(a=>{ if(ids.includes(a.id)) a.turmaId=destino; });
  salvar();
  alert(`${ids.length} aluno(s) ${destino?'matriculado(s) em '+turmaNome(destino):'removido(s) da turma'}.`);
  render();
}

/* ---------- TELA: Presença ---------- */
function tela_presenca(c){
  if(!dados.turmas.length){ c.innerHTML=`<div class="card"><div class="vazio">Crie uma turma primeiro.</div></div>`; return; }
  const opcoes=dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("");
  c.innerHTML=`
  <div class="card noprint">
    <h2>Chamada</h2>
    <div class="linha">
      <div style="max-width:260px"><label>Turma</label><select id="p_turma" onchange="render_presenca()">${opcoes}</select></div>
      <div style="max-width:200px"><label>Data</label><input type="date" id="p_data" value="${hojeISO()}" onchange="render_presenca()"></div>
      <div style="flex:0"><button class="btn secund" onclick="window.print()">🖨 Imprimir</button></div>
    </div>
  </div>
  <div class="card"><h2 id="p_titulo">Lista de chamada</h2><div id="lista_presenca"></div></div>`;
  render_presenca();
}
function chavePresenca(tid,data){ return tid+"|"+data; }
function render_presenca(){
  const alvo=document.getElementById("lista_presenca"); if(!alvo) return;
  const tid=document.getElementById("p_turma").value;
  const data=document.getElementById("p_data").value||hojeISO();
  document.getElementById("p_titulo").textContent=`Chamada — ${turmaNome(tid)} — ${dataBR(data)}`;
  const alunos=alunosDaTurma(tid);
  if(!alunos.length){ alvo.innerHTML=`<div class="vazio">Nenhum aluno nesta turma. Matricule alunos primeiro.</div>`; return; }
  const ch=chavePresenca(tid,data);
  const reg=dados.presencas[ch]||{};
  let h=`<table><tr><th>#</th><th>Aluno</th><th>Situação</th></tr>`;
  alunos.forEach((a,i)=>{
    const presente = reg[a.id]!==false; // default presente
    h+=`<tr>
      <td>${i+1}</td>
      <td>${esc(a.nome)}</td>
      <td>
        <span class="pill ${presente?'p':'f'}" id="pill_${a.id}">${presente?'Presente':'Falta'}</span>
        <button class="mini noprint" onclick="togglePresenca('${tid}','${data}','${a.id}')">alternar</button>
      </td></tr>`;
  });
  h+=`</table>`;
  const faltas=alunos.filter(a=>reg[a.id]===false).length;
  h+=`<p style="margin-top:12px;font-size:13px;color:var(--suave)">Presentes: <b>${alunos.length-faltas}</b> · Faltas: <b>${faltas}</b> · Total: <b>${alunos.length}</b></p>`;
  alvo.innerHTML=h;
}
function togglePresenca(tid,data,aid){
  const ch=chavePresenca(tid,data);
  if(!dados.presencas[ch]) dados.presencas[ch]={};
  const atual = dados.presencas[ch][aid]!==false;
  dados.presencas[ch][aid] = atual? false : true;
  salvar(); render_presenca();
}

/* ---------- TELA: Notas (com média automática) ---------- */
function tela_notas(c){
  if(!dados.turmas.length){ c.innerHTML=`<div class="card"><div class="vazio">Crie uma turma primeiro.</div></div>`; return; }
  const opcoes=dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("");
  c.innerHTML=`
  <div class="card noprint">
    <h2>Notas</h2>
    <div class="linha">
      <div style="max-width:260px"><label>Turma</label><select id="n_turma" onchange="trocarTurmaNotas()">${opcoes}</select></div>
      <div style="max-width:260px"><label>Matéria</label><select id="n_materia" onchange="render_notas()"></select></div>
      <div style="flex:0"><button class="btn secund" onclick="window.print()">🖨 Imprimir</button></div>
    </div>
    <div class="linha" style="margin-top:6px">
      <div><label>Nova matéria para esta turma</label><input id="n_novamateria" placeholder="Ex: Matemática"></div>
      <div style="flex:0"><button class="btn" onclick="addMateria()">Criar matéria</button></div>
    </div>
  </div>
  <div class="card"><h2 id="n_titulo">Notas</h2><div id="lista_notas"></div></div>`;
  trocarTurmaNotas();
}
function trocarTurmaNotas(){
  const tid=document.getElementById("n_turma").value;
  const sel=document.getElementById("n_materia");
  const ms=materiasDaTurma(tid);
  sel.innerHTML = ms.length? ms.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join("") : `<option value="">(crie uma matéria)</option>`;
  render_notas();
}
function addMateria(){
  const tid=document.getElementById("n_turma").value;
  const nome=document.getElementById("n_novamateria").value.trim();
  if(!nome){ alert("Digite o nome da matéria."); return; }
  dados.materias.push({id:id(),nome,turmaId:tid}); salvar();
  render(); // volta e re-renderiza
}
function render_notas(){
  const alvo=document.getElementById("lista_notas"); if(!alvo) return;
  const tid=document.getElementById("n_turma").value;
  const mid=document.getElementById("n_materia").value;
  const tituloEl=document.getElementById("n_titulo");
  const mNome = dados.materias.find(m=>m.id===mid)?.nome || "—";
  tituloEl.textContent=`Notas — ${turmaNome(tid)} — ${mNome}`;
  const alunos=alunosDaTurma(tid);
  if(!mid){ alvo.innerHTML=`<div class="vazio">Crie uma matéria para lançar notas.</div>`; return; }
  if(!alunos.length){ alvo.innerHTML=`<div class="vazio">Nenhum aluno nesta turma.</div>`; return; }
  let h=`<table><tr><th>Aluno</th><th>Notas lançadas</th><th class="noprint">Lançar nota</th><th>Média</th></tr>`;
  alunos.forEach(a=>{
    const notas=dados.notas.filter(n=>n.alunoId===a.id && n.materiaId===mid);
    const soma=notas.reduce((s,n)=>s+(parseFloat(n.valor)||0),0);
    const media=notas.length? (soma/notas.length):null;
    const cls = media==null?'':(media>=6?'media-alta':'media-baixa');
    let lanc = notas.map(n=>`<span class="pill p" title="${esc(n.descricao||'')}">${n.valor}<button class="mini perigo noprint" style="margin-left:4px;padding:1px 6px" onclick="delNota('${n.id}')">x</button></span>`).join(" ") || '<span style="color:var(--suave)">—</span>';
    h+=`<tr>
      <td>${esc(a.nome)}</td>
      <td>${lanc}</td>
      <td class="noprint">
        <div style="display:flex;gap:4px">
          <input id="nota_${a.id}" placeholder="nota" style="width:70px" type="number" step="0.1" min="0" max="10">
          <input id="desc_${a.id}" placeholder="descrição (opcional)" style="width:120px">
          <button class="mini" onclick="addNota('${a.id}','${mid}')">+ add</button>
        </div>
      </td>
      <td class="${cls}">${media==null?'—':media.toFixed(1)}</td>
    </tr>`;
  });
  alvo.innerHTML=h+"</table>";
}
function addNota(aid,mid){
  const v=document.getElementById("nota_"+aid).value.trim();
  const d=document.getElementById("desc_"+aid).value.trim();
  if(v===""){ alert("Digite a nota."); return; }
  dados.notas.push({id:id(),alunoId:aid,materiaId:mid,descricao:d,valor:parseFloat(v)});
  salvar(); render_notas();
}
function delNota(nid){ dados.notas=dados.notas.filter(n=>n.id!==nid); salvar(); render_notas(); }

/* ---------- TELA: Conteúdo de aula ---------- */
function tela_conteudo(c){
  if(!dados.turmas.length){ c.innerHTML=`<div class="card"><div class="vazio">Crie uma turma primeiro.</div></div>`; return; }
  const opcoes=dados.turmas.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join("");
  c.innerHTML=`
  <div class="card noprint">
    <h2>Registrar conteúdo da aula</h2>
    <div class="linha">
      <div style="max-width:220px"><label>Turma</label><select id="co_turma" onchange="trocarTurmaConteudo()">${opcoes}</select></div>
      <div style="max-width:220px"><label>Matéria</label><select id="co_materia"></select></div>
      <div style="max-width:170px"><label>Data</label><input type="date" id="co_data" value="${hojeISO()}"></div>
    </div>
    <label>Conteúdo trabalhado</label>
    <textarea id="co_texto" placeholder="Descreva o conteúdo da aula..."></textarea>
    <div style="margin-top:10px"><button class="btn" onclick="addConteudo()">Salvar conteúdo</button></div>
  </div>
  <div class="card"><h2>Conteúdos registrados</h2><div id="lista_conteudo"></div></div>`;
  trocarTurmaConteudo();
  render_conteudo();
}
function trocarTurmaConteudo(){
  const tid=document.getElementById("co_turma").value;
  const sel=document.getElementById("co_materia");
  const ms=materiasDaTurma(tid);
  sel.innerHTML = ms.length? ms.map(m=>`<option value="${m.id}">${esc(m.nome)}</option>`).join("") : `<option value="">(crie matéria na aba Notas)</option>`;
  render_conteudo();
}
function addConteudo(){
  const tid=document.getElementById("co_turma").value;
  const mid=document.getElementById("co_materia").value||null;
  const data=document.getElementById("co_data").value||hojeISO();
  const texto=document.getElementById("co_texto").value.trim();
  if(!texto){ alert("Escreva o conteúdo da aula."); return; }
  dados.conteudos.push({id:id(),turmaId:tid,materiaId:mid,data,texto}); salvar();
  document.getElementById("co_texto").value="";
  render_conteudo();
}
function render_conteudo(){
  const alvo=document.getElementById("lista_conteudo"); if(!alvo) return;
  const tid=document.getElementById("co_turma").value;
  let lista=dados.conteudos.filter(x=>x.turmaId===tid).sort((a,b)=>b.data.localeCompare(a.data));
  if(!lista.length){ alvo.innerHTML=`<div class="vazio">Nenhum conteúdo registrado para esta turma.</div>`; return; }
  let h=`<table><tr><th style="width:110px">Data</th><th style="width:140px">Matéria</th><th>Conteúdo</th><th class="noprint"></th></tr>`;
  lista.forEach(x=>{
    const mNome=dados.materias.find(m=>m.id===x.materiaId)?.nome||"—";
    h+=`<tr>
      <td>${dataBR(x.data)}</td><td>${esc(mNome)}</td><td>${esc(x.texto).replace(/\n/g,"<br>")}</td>
      <td class="noprint" style="text-align:right"><button class="mini perigo" onclick="delConteudo('${x.id}')">🗑</button></td>
    </tr>`;
  });
  alvo.innerHTML=h+"</table>";
}
function delConteudo(cid){ if(!confirm("Apagar este registro de conteúdo?"))return; dados.conteudos=dados.conteudos.filter(x=>x.id!==cid); salvar(); render_conteudo(); }

/* ---------- TELA: Backup (exportar/importar/limpar) ---------- */
function tela_dados(c){
  c.innerHTML=`
  <div class="card">
    <h2>💾 Backup e segurança dos dados</h2>
    <div class="aviso">Seus dados ficam salvos <b>só neste navegador, neste computador</b>. Faça backup de vez em quando (ex: num pendrive) pra não perder nada se formatar o PC ou limpar o navegador.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn verde" onclick="exportar()">⬇️ Exportar backup (arquivo)</button>
      <label class="btn secund" style="cursor:pointer;margin:0">⬆️ Importar backup
        <input type="file" accept=".json" style="display:none" onchange="importar(this)">
      </label>
      <button class="btn perigo" onclick="limparTudo()">🗑 Apagar TUDO</button>
    </div>
  </div>
  <div class="card">
    <h2>Resumo</h2>
    <table>
      <tr><th>Turmas</th><td>${dados.turmas.length}</td></tr>
      <tr><th>Alunos</th><td>${dados.alunos.length}</td></tr>
      <tr><th>Matérias</th><td>${dados.materias.length}</td></tr>
      <tr><th>Notas lançadas</th><td>${dados.notas.length}</td></tr>
      <tr><th>Registros de conteúdo</th><td>${dados.conteudos.length}</td></tr>
    </table>
  </div>`;
}
function exportar(){
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="diario-backup-"+hojeISO()+".json"; a.click();
  URL.revokeObjectURL(url);
}
function importar(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const novo=JSON.parse(r.result);
      if(!confirm("Isso vai SUBSTITUIR todos os dados atuais pelos do arquivo. Continuar?")) return;
      dados=Object.assign(estadoInicial(),novo); salvar(); render();
      alert("Backup importado com sucesso!");
    }catch(e){ alert("Arquivo inválido."); }
  };
  r.readAsText(f);
}
function limparTudo(){
  if(!confirm("APAGAR TUDO? Isso remove todas as turmas, alunos, notas e conteúdos. Não dá pra desfazer.")) return;
  if(!confirm("Tem certeza mesmo? Faça um backup antes se precisar.")) return;
  dados=estadoInicial(); salvar(); render();
}

/* ---------- Start ---------- */
render();
</script>
</body>
</html>
